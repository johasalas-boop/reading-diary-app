<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario emocional de lectura</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="vista-biblioteca">
    <h1>Mi biblioteca</h1>

    <form id="form-agregar">
      <input type="text" id="input-titulo" placeholder="Título" required>
      <input type="text" id="input-autor" placeholder="Autor" required>
      <select id="input-estado">
        <option value="leyendo">Leyendo</option>
        <option value="terminado">Terminado</option>
        <option value="abandonado">Abandonado</option>
      </select>
      <button type="submit" id="boton-guardar-libro">Agregar</button>
      <button type="button" id="boton-cancelar-edicion-libro" style="display: none;">Cancelar edición</button>
    </form>

    <div id="biblioteca"></div>
  </div>

  <div id="vista-capitulos" style="display: none;">
    <button id="boton-volver">← Volver a biblioteca</button>
    <h1 id="titulo-libro-actual"></h1>

    <form id="form-capitulo">
      <input type="text" id="input-nombre-capitulo" placeholder="Nombre del capítulo (opcional)">

      <label for="input-intensidad">Intensidad emocional: <span id="valor-intensidad">0</span></label>
      <input type="range" id="input-intensidad" min="0" max="5" step="1" value="0">

      <fieldset id="fieldset-emociones">
        <legend>Emociones</legend>
        <div id="contenedor-chips-emociones"></div>
        <div id="agregar-emocion">
          <input type="text" id="input-nueva-emocion" placeholder="Nueva emoción">
          <button type="button" id="boton-agregar-emocion">+ Agregar</button>
        </div>
      </fieldset>

      <textarea id="input-nota" placeholder="Nota corta (opcional)"></textarea>

      <button type="submit" id="boton-guardar-capitulo">Agregar capítulo</button>
      <button type="button" id="boton-cancelar-edicion" style="display: none;">Cancelar edición</button>
    </form>

    <div id="seccion-grafico">
      <h2>Curva emocional</h2>
      <svg id="grafico-emocional" viewBox="0 0 300 160"></svg>
      <p id="mensaje-grafico-vacio">Todavía no hay capítulos registrados.</p>
    </div>

    <div id="lista-capitulos"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
